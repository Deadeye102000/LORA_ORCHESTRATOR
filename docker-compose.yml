services:

  # ─── MinIO S3-Compatible Object Store ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: lora_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── One-shot init container: creates the 'lora-models' bucket ───────────────
  createbuckets:
    image: minio/mc:latest
    container_name: lora_createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/lora-models;
        echo 'Bucket lora-models ready.';
        exit 0;
      "

  # ─── FastAPI Control Plane ────────────────────────────────────────────────────
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: lora_control_plane
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./lora_orchestrator.db
    volumes:
      - control_plane_data:/app/data
    depends_on:
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Worker Daemon (simulated compute node) ───────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: lora_worker
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      WORKER_ID: docker-worker-1
      POLL_INTERVAL: "5"
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: lora-models
    volumes:
      - worker_weights:/app/weights
    depends_on:
      control-plane:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio_data:
  control_plane_data:
  worker_weights:
